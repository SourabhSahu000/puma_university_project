<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | PUMA University</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
            max-width: 520px;
            width: 100%;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
<div class="error-card">
    <img src="/static/logo.png" alt="PUMA University Crest" width="64" height="64" class="mb-3">
    <h1 class="display-3 fw-bold text-primary mb-2">404</h1>
    <h4 class="fw-bold text-dark mb-2">Page Not Found</h4>
    <p class="text-muted small mb-4">
        The requested URL was not found on the PUMA University Portal.
    </p>
    <a href="/" class="btn btn-puma-primary px-4 py-2">
        Return to Portal Home
    </a>
</div>
</body>
</html>
